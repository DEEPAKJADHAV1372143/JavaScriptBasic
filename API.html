<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

<script>
	var setUrl='https://jsonplaceholder.typicode.com/users';
	fetch(setUrl).then((res)=>{
		return res.json();
	}).then((res)=>{
		/// atuall 
		console.log(res)
		res.forEach((a)=>{
			var tag=document.createElement('div');
	         tag.innerText='Name: '+a.name;
	         document.body.appendChild(tag)

	        var tag2=document.createElement('div');
	         tag2.innerHTML='Phone: '+a.phone+"<hr>"; 
	         document.body.appendChild(tag2)
		})
	}).catch((error)=>{
      console.log(error)
	})
</script>
